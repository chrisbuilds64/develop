# The cockpit — stage {{label}} ({{env}}). Generated by pressroom-env; edit envs.toml, not this file.
# No workshop modules: the applications are casefile workspaces (ADR-018); the old pipeline module left the cockpit
# on 2026-10-26 (Chris). The pipeline source stays: the people of the team are read from it. Users and the cookie secret are shared by all stages: one sign-in works
# everywhere, but a cookie is scoped to its stage's path.
[cockpit]
name = "Cockpit"        # the shell, not one of its applications (ADR-018, Chris 2026-10-28)
locale = "de"
bind = "127.0.0.1:{{port}}"
base_path = "{{base_path}}"
environment = "{{env}}"
default_role = "guest"
audit = "cockpit-audit.jsonl"
users = "{{users_json}}"
accounts = "{{accounts}}"      # one directory per person, shared by all stages: settings and the secrets they bring
agents = "{{agents}}"                # the organisation's agent templates (ADR-020): read from the shared control, hired into accounts
workspaces = "workspaces.json"  # this stage's applications and workspaces, served under /w/<id>
secret = "{{cookie_secret}}"
people = "pipeline:people.json"
plugins = "plugins"
secure_cookies = true
stale_after_hours = 720

[[source]]
id = "pipeline"
label = "Content-Pipeline"
path = "{{data}}"            # read from the disk (the runner is in Nextcloud's group)
tools_path = "{{mount}}"     # every write goes through the WebDAV mount
mode = "read-write"
sensitivity = "internal"

[[role]]
id = "operator"
modules = ["*"]
max_sensitivity = "confidential"
actions = ["*"]

[[role]]
id = "guest"
modules = []
max_sensitivity = "internal"
actions = ["*"]        # everyone does everything for now; a user concept comes later (Chris, 2026-10-13)
