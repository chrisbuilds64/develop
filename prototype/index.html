<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casefile · Pro concept</title>
<style>
:root{--fg:20,20,40;--bg:#F6F5F2;--rail:#EFEEEA;--panel:#FFFFFF;--raised:#FFFFFF;--line:rgba(20,20,40,.08);--ink:#0E0E12;--ink2:#2A2A32;--sub:#5E5E68;--mut:#76767F;--you:#2F6BFF;--ai:#7046D8;--aiDeep:#9B7BF5;--urgent:#B86E00;--seal:#C2562E;--chip:#FFFFFF;--hov:#F3F2EE;--segon:#FFFFFF;--avbg:#E4E2DC;--toastbg:#16161D;--faint:#B5B4BC;--scrim:rgba(30,28,40,.28);--sealIco:#F0A47F;--primHov:#000;--shadow:0 1px 2px rgba(20,20,40,.05),0 8px 24px rgba(20,20,40,.06);--glow:radial-gradient(900px 380px at 15% -10%,rgba(155,123,245,.14),transparent 60%)}
:root[data-theme=dark]{--fg:255,255,255;--bg:#161618;--rail:#1C1C1F;--panel:#212125;--raised:#29292E;--line:rgba(255,255,255,.08);--ink:#EDEDF0;--ink2:#C9C9D1;--sub:#A3A3AD;--mut:#8A8A95;--you:#6E9BFF;--ai:#CDBBFF;--aiDeep:#B79CFF;--urgent:#F2A541;--seal:#E8875F;--chip:#26262B;--hov:#2A2A2F;--segon:#34343A;--avbg:#2C2C32;--toastbg:#2A2A2F;--faint:#4A4A52;--scrim:rgba(5,5,7,.6);--sealIco:#B2552F;--primHov:#fff;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.28);--glow:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;letter-spacing:-.012em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.mono{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
.kbd{font-family:inherit;font-size:11px;color:var(--sub);border:1px solid rgba(var(--fg),.12);border-bottom-width:2px;border-radius:5px;padding:0 5px;line-height:16px;background:var(--chip);display:inline-block}
.app{display:flex;height:100vh;overflow:hidden}
/* rail */
.rail{flex:0 0 232px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(180deg,#3A8DFF 0%,#1877F2 55%,#0F66DB 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(24,119,242,.3);display:grid;place-items:center}.mark i{width:10px;height:10px;border-radius:3px;background:#fff}
.tag{font-family:inherit;font-size:10px;color:var(--mut);border:1px solid rgba(var(--fg),.1);border-radius:4px;padding:1px 5px}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;margin-bottom:10px;border-radius:8px;border:1px solid rgba(var(--fg),.08);background:var(--panel);color:var(--mut);cursor:pointer;width:100%}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:7px;color:var(--sub);font-size:13px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.nav:hover{background:rgba(var(--fg),.04);color:var(--ink)}.nav.on{background:rgba(var(--fg),.07);color:var(--ink)}
.nav .n{margin-left:auto;font-family:inherit;font-size:11px;color:var(--mut)}
.badge{margin-left:auto;min-width:20px;height:18px;border-radius:9px;background:var(--you);color:var(--bg);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.sq{width:8px;height:8px;border-radius:2px;flex:none}
.cap{margin:16px 10px 6px;font-size:11px;color:var(--mut);font-weight:500}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 2px;border-top:1px solid var(--line)}
.av{width:28px;height:28px;border-radius:50%;background:var(--avbg);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-bottom:1px solid var(--line);flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:9px;border:1px solid rgba(var(--fg),.1);background:var(--raised);font-size:13px;cursor:pointer}
.btn:hover{background:var(--hov)}
.btn.ai{border-color:rgba(183,156,255,.25);background:rgba(183,156,255,.08);color:var(--ai)}
.primary{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px;border-radius:10px;border:none;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer}
.primary:hover{background:var(--primHov)}
.primary .k{font-family:inherit;font-size:11px;padding:1px 6px;border-radius:5px;background:rgba(10,10,12,.1)}
.scroll{flex:1;overflow:auto}
/* today */
.today{display:flex;flex-wrap:wrap;gap:40px;padding:28px 40px 60px;max-width:1240px;margin:0 auto}
.h1{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;font-size:34px;font-weight:600;letter-spacing:-.026em;line-height:1.1}
.rgrp{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}.row{display:grid;grid-template-columns:10px 132px minmax(0,1fr) auto 52px 26px;align-items:center;gap:14px;height:52px;padding:0 16px;cursor:pointer;position:relative}.row+.row::before{content:'';position:absolute;top:0;left:40px;right:16px;height:1px;background:var(--line)}
.row:hover{background:var(--hov)}.row:hover::before,.row:hover+.row::before{opacity:0}.row .rk{opacity:0}.row:hover .rk{opacity:1}
.grph{display:flex;align-items:center;gap:10px;margin:30px 4px 10px;font-size:12px;font-weight:600}
.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 18px}
.card.aiw{border-color:rgba(183,156,255,.18);background:linear-gradient(180deg,rgba(183,156,255,.07),transparent 70%),var(--panel)}
.aw{flex-direction:column;align-items:stretch;gap:0;text-align:left;margin-top:12px}
.aw-k{font-size:11.5px;font-weight:500;color:var(--mut);letter-spacing:.01em}
.aw-t{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-.014em;line-height:1.3;margin-top:4px}
.aw-m{font-size:12.5px;color:var(--sub);margin-top:3px}
.aw-n{font-size:12px;color:var(--mut);line-height:1.45;margin-top:10px}
.aw>*{display:block;width:100%;text-align:left}.aw .prog{margin-top:12px}
.prog{margin-top:8px;height:2px;border-radius:1px;background:rgba(var(--fg),.06);overflow:hidden}.prog i{display:block;height:2px;width:40%;background:linear-gradient(90deg,color-mix(in srgb,var(--aiDeep) 40%,transparent),var(--aiDeep));animation:crawl 1.8s ease-in-out infinite alternate}
@keyframes crawl{from{margin-left:0}to{margin-left:60%}}
/* workspace */
.ws{display:flex;flex:1;min-height:0}
.queue{flex:0 0 300px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.seg{display:flex;gap:2px;margin:12px 12px 6px;padding:3px;border-radius:9px;background:var(--panel)}
.seg button{flex:1 1 auto;white-space:nowrap;padding:0 8px;height:26px;border:none;border-radius:6px;background:transparent;color:var(--mut);font-size:12px;cursor:pointer}.seg button.on{background:var(--segon);color:var(--ink);font-weight:500}
.q{position:relative;display:flex;flex-direction:column;gap:3px;padding:10px 12px 10px 26px;border-radius:9px;cursor:pointer;margin:0 8px}
.q:hover{background:rgba(var(--fg),.035)}.q.on{background:rgba(var(--fg),.065)}
.q .dot{position:absolute;left:11px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--you)}
.center{flex:1;min-width:0;overflow:auto}
.case{padding:28px 32px 60px;max-width:780px}
.title{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.aicard{margin-top:22px;border-radius:16px;padding:1px;background:linear-gradient(160deg,rgba(155,123,245,.42),rgba(155,123,245,.14) 50%,rgba(var(--fg),.07))}
.tgt{white-space:nowrap}.tgt i{display:inline-block;width:9px;height:9px;border-radius:2.5px;margin:0 7px 0 3px;vertical-align:.08em}
.aicard>div{border-radius:15px;background:radial-gradient(120% 140px at 0% 0%,rgba(155,123,245,.08),transparent 70%),var(--panel);padding:20px 22px 18px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;margin-top:16px}
.fact{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid rgba(var(--fg),.06);font-size:13px}
.quote{font-size:12px;color:var(--sub);background:rgba(var(--fg),.04);border-radius:7px;padding:5px 9px}
.proposal{margin-top:18px;padding:14px 16px;border-radius:12px;background:rgba(183,156,255,.08);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
.docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.doc{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:11px;background:var(--panel);border:1px solid rgba(var(--fg),.06);cursor:pointer;text-align:left}
.doc.missing{background:transparent;border-style:dashed;border-color:rgba(var(--fg),.14);color:var(--sub)}
.insp{flex:0 0 340px;border-left:1px solid var(--line);background:var(--rail);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:18px;height:52px;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);font-size:13px}
.tabs button{border:none;background:none;color:var(--mut);height:52px;cursor:pointer;padding:0}.tabs button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.thread{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.msg p{margin:6px 0 0;font-size:14px;line-height:1.4;letter-spacing:-.011em;color:var(--ink2);white-space:pre-wrap}
.ask{display:flex;align-items:center;gap:10px;height:42px;margin:12px 18px 16px;padding:0 12px;border-radius:11px;background:var(--raised);border:1px solid rgba(var(--fg),.08)}
.ask:focus-within{border-color:rgba(183,156,255,.5);box-shadow:0 0 0 3px rgba(183,156,255,.12)}
.ask input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:13px}
.shimmer{background:linear-gradient(90deg,var(--ink) 20%,var(--ai) 50%,var(--ink) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2.4s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-150% 0}}
.empty{padding:80px 32px;text-align:center;color:var(--sub)}
.foot{display:flex;gap:16px;align-items:center;height:34px;padding:0 24px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);flex:none;overflow:hidden;white-space:nowrap}
/* palette */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;z-index:10}
.pal{width:min(640px,calc(100% - 32px));border-radius:16px;background:var(--chip);border:1px solid rgba(var(--fg),.1);box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.pal input{width:100%;height:56px;border:none;outline:none;background:transparent;padding:0 18px;font-size:16px;border-bottom:1px solid rgba(var(--fg),.07)}
.pl{max-height:52vh;overflow:auto;padding:6px}
.grp{font-size:11px;font-weight:500;color:var(--mut);padding:10px 12px 4px}
.it{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:9px;cursor:pointer}
.it.sel{background:rgba(var(--fg),.06)}.it.aiit.sel{background:rgba(183,156,255,.12)}
.toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:var(--toastbg);border:1px solid rgba(var(--fg),.1);box-shadow:0 20px 50px rgba(0,0,0,.5);font-size:13px;z-index:20;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:1100px){.insp{display:none}}
@media (max-width:800px){.rail{display:none}.queue{display:none}.navtog{display:grid!important}body.navopen .navtog{display:none!important}.bar{padding-left:56px!important}.row{grid-template-columns:10px minmax(0,1fr) auto;gap:12px}.row>span:nth-child(2),.row>span:nth-child(4),.row .rk{display:none}.today{padding:28px 16px 48px}.bar .cid,.bar .cid+span,.ws .bar>span[style*='margin-left:auto'],.foot{display:none!important}.mback{white-space:nowrap}body.navopen .rail{display:flex;position:fixed;left:0;top:0;bottom:0;z-index:40;width:260px;box-shadow:0 20px 60px rgba(0,0,0,.3)}body.navopen .navscrim{display:block}}
.mback{display:none}
@media (max-width:800px){.ws .queue{display:flex;flex:1}.ws>div:not(.queue){display:none!important}body.mcase .ws .queue{display:none}body.mcase .ws>div:not(.queue){display:flex!important}.mback{display:inline-flex;border:none;background:none;color:var(--you);font:inherit;font-size:14px;cursor:pointer;padding:0;margin-right:6px}}
.navtog{display:none;position:fixed;left:10px;top:11px;z-index:41;width:32px;height:30px;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}.navscrim{display:none;position:fixed;inset:0;z-index:39;background:var(--scrim)}

.card,.doc,.aicard{box-shadow:var(--shadow)}
.today-wrap{background:var(--glow)}
.toast{color:#F4F4F6}
.kbd{box-shadow:0 1px 0 rgba(var(--fg),.06)}
.seg button.on{box-shadow:var(--shadow)}

.theme{margin-left:auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--sub)}
.home{display:flex;align-items:center;gap:10px;border:none;background:none;padding:2px 6px 2px 0;border-radius:8px;cursor:pointer}
.home:hover{opacity:.75}
.sealrow{display:flex;gap:10px;align-items:center;width:100%;margin-top:10px;padding:8px;margin-left:-8px;margin-right:-8px;width:calc(100% + 16px);border:none;background:none;border-radius:9px;font-size:13px;cursor:pointer;color:inherit}
.sealrow:hover{background:rgba(var(--fg),.04)}
.q{gap:2px;padding:11px 12px 12px 26px;border-radius:12px}
.q+.q::before{content:"";position:absolute;top:0;left:26px;right:12px;height:1px;background:var(--line)}
.q.on::before,.q.on+.q::before,.q:hover::before,.q:hover+.q::before{opacity:0}
.q.on,.q.on:hover{background:var(--panel);box-shadow:var(--shadow)}
.qtop{position:relative;display:flex;align-items:flex-start;gap:10px}
.qt{position:relative;flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q .dot{left:-16px;top:6px}
.qa{flex:none;font-size:12px;color:var(--mut);padding-top:1px}
.qw{color:var(--mut);animation:qw 1.6s ease-in-out infinite alternate}@keyframes qw{from{opacity:.45}to{opacity:1}}
.qn{font-size:13px;color:var(--sub)}
.qp{font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aipulse{color:var(--ai);display:inline-block;margin-right:4px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.8)}}
.toast{gap:12px;padding:10px 10px 10px 16px;overflow:hidden}
.undo{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:8px;border:none;background:rgba(255,255,255,.12);color:#fff;font-weight:600;cursor:pointer}
.undo:hover{background:rgba(255,255,255,.2)}
.ukbd{font-size:11px;font-weight:500;opacity:.7}
.ubar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:rgba(255,255,255,.35);transform-origin:left;animation:ubar 6s linear forwards}
@keyframes ubar{to{transform:scaleX(0)}}
.ro .proposal button,.ro .aicard .btn,.ro .card .primary:not(.keep){display:none}
.ro .proposal::after{content:"Decided";margin-left:auto;font-size:12px;font-weight:600;color:var(--mut)}
.thread{gap:10px}
.msg{background:var(--panel);border-radius:14px;padding:12px 14px 13px;box-shadow:var(--shadow)}
.msg p{color:var(--ink)}
.mh{display:flex;gap:8px;align-items:baseline;font-size:12px}
.mh b{font-weight:600}
.mh span{color:var(--mut);margin-left:auto}
.msg.ai{background:color-mix(in srgb,var(--aiDeep) 7%,var(--panel))}
.msg.ai .mh b{color:var(--ai)}
.msg.mine{margin-left:28px;background:color-mix(in srgb,var(--you) 7%,var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--you) 14%,transparent)}
.msg.mine p{color:var(--ink)}.msg.mine .mh b{color:var(--ink)}
.msg.mine .mh span{color:var(--mut)}
.msg.oq{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--you) 45%,transparent)}
.msg.oq .mh b{color:var(--you)}
.mq{display:flex;gap:6px;margin-top:10px}
.mq .btn{height:28px;font-size:12px}
.facts2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px 24px;margin:20px 0 0;padding:16px 18px;border-radius:12px;background:rgba(var(--fg),.035)}
.facts2 div{min-width:0}
.facts2 dt{font-size:12px;color:var(--mut);margin-bottom:3px}
.facts2 dd{margin:0;font-size:14px;letter-spacing:-.011em;color:var(--ink);overflow-wrap:normal;hyphens:none}
.src{margin-top:18px}
.srch{font-size:12px;color:var(--mut);margin-bottom:8px}
.srcq{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:4px 0 4px 12px;border-left:2px solid rgba(var(--fg),.13);margin-bottom:6px;font-size:14px;color:var(--ink2);letter-spacing:-.011em}
.srcq em{font-style:normal;font-size:12px;color:var(--mut);white-space:nowrap}
.acts2{display:flex;gap:2px;margin-top:12px;flex-wrap:wrap;align-items:center}
.ghost{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;border:none;background:none;color:var(--ink2);font-size:14px;cursor:pointer}
.ghost:hover{background:rgba(var(--fg),.06);color:var(--ink)}
.ghost.danger{margin-left:auto;color:#D0342C}
.ghost.danger:hover{background:rgba(208,52,44,.08)}
:root[data-theme=dark] .ghost.danger{color:#FF6961}
.doc.photo{padding:0;overflow:hidden;position:relative;aspect-ratio:4/3;justify-content:flex-end;border:none}
.doc.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
.doc.photo:hover img{transform:scale(1.03)}
.doc.photo .pn{position:relative;margin:8px;align-self:flex-start;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:500}
.doc:hover{box-shadow:0 2px 4px rgba(20,20,40,.06),0 14px 34px rgba(20,20,40,.1)}
.dn{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}.dn svg{color:var(--mut);flex:none}
.rd{max-width:900px}
.rd-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rd-tabs{margin:0;flex:0 1 auto;overflow:auto}.rd-tabs button{flex:none;padding:0 12px}
.rd-meta{font-size:12px;color:var(--mut);margin:14px 2px 10px}
.rd-photo{border-radius:14px;overflow:hidden;background:#111;box-shadow:var(--shadow);display:grid;place-items:center}
.rd-photo img{display:block;max-width:100%;max-height:calc(100vh - 230px);object-fit:contain}
.rd-mail{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:24px 28px}
.rd-mail dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line);font-size:13px}
.rd-mail dl div{display:contents}.rd-mail dt{color:var(--mut)}.rd-mail dd{margin:0;color:var(--ink)}
.rd-body{white-space:pre-wrap;font-size:15px;line-height:1.5;letter-spacing:-.012em;color:var(--ink)}
