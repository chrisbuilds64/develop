[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casefile"
version = "0.1.0"
description = "The case that leads itself: folders are the truth, one core writes, a step is one button."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Christian Moser", email = "cm@cmoser.com" }]
dependencies = [
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
casefile = "casefile.cli.main:main"

[tool.setuptools.packages.find]
include = ["casefile*"]

[tool.setuptools.package-data]
casefile = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
