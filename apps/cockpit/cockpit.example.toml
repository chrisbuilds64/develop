# Cockpit — configuration
#
# Three segments, read in this order:
#   [[source]]  what the cockpit may see at all         (nothing that is not listed here)
#   [[module]]  what is shown, from which plugin, from which sources
#   [[role]]    who may open which modules, read up to which sensitivity, run which actions
#
# Paths may start with ~. Relative paths are taken from the folder of this file.
# `{user.context}` in a source path is the signed-in user's Context Loop folder.
# Users: `cockpit user add <name> --role <role> --context <dir>`. With users on file,
# sign-in is required. Plugins: `cockpit plugin list | add <path> [--link] | remove <id>`.
[cockpit]
name = "Cockpit"
locale = "de"
bind = "127.0.0.1:8200"
default_role = "operator"
audit = "cockpit-audit.jsonl"
users = "users.json"
secret = ".cockpit-secret"
plugins = "plugins"
stale_after_hours = 24
# login_required = true     # inferred from users.json existing; write it down before going public
# secure_cookies = true     # cookies only over TLS — set behind the reverse proxy
# max_upload_mb = 50        # a file field larger than this is refused before it is written in full
# lockout_after = 5         # failed sign-ins per name before the name is locked …
# lockout_minutes = 15      # … for this long

# --- Sources: {user.context} is the signed-in user's Context Loop folder -------------
[[source]]
id = "context"
label = "Your context"
path = "{user.context}"
mode = "read-write"                   # tools may write here — the cockpit itself never does
sensitivity = "internal"

[[source]]
id = "worklist"
label = "Work list"
path = "{user.context}"
include = ["todo.json", "todo.schema.json"]
mode = "read-write"
sensitivity = "internal"

[[source]]
id = "tools"
label = "Tools"
path = "~/ChrisBuilds64/control/scripts"
include = ["todo.py", "todo_validate.py"]
sensitivity = "internal"

[[source]]
id = "pipeline"
label = "Content pipeline"
path = "~/ChrisBuilds64/content/flow"
sensitivity = "internal"

[[source]]
id = "audits"
label = "Audits"
path = "~/ChrisBuilds64/control/audits"
sensitivity = "internal"

[[source]]
id = "contextloop"
label = "Context Loop"
path = "~/ChrisBuilds64/context-loop"
include = [".claude-plugin", "skills"]
sensitivity = "public"

[[source]]
id = "elicitation"
label = "Canon elicitation"
path = "~/ChrisBuilds64/develop/apps/gatehouse/instances/demo"
include = ["run.json", "audit.jsonl"]
sensitivity = "confidential"

# --- Modules: each names a plugin; reader and app come from its manifest -------------
[[module]]
id = "worklist"
plugin = "worklist"
sources = ["worklist", "tools"]     # the plugin's needs, in order: the list, then the released todo.py
maturity = "running"

[[module]]
id = "decisions"
plugin = "decisions"
sources = ["context"]
maturity = "running"

[[module]]
id = "pipeline"
plugin = "pipeline"
sources = ["pipeline"]
maturity = "running"
# Actions come with the plugin (see its plugin.json). Released read-only above, so none are
# offered here; set mode = "read-write" on the source to get move, review_append, upload, verify,
# skill — or keep a subset:   actions = ["review_append", "verify"]
# An instance may add its own:
#   [[module.action]]
#   id = "notify"
#   tool = "tools"            # a released script of yours
#   command = "notify.py"
#   args = ["{ref}"]
#   scope = "document"

[[module]]
id = "audits"
plugin = "audits"
sources = ["audits"]
maturity = "running"

[[module]]
id = "contextloop"
plugin = "contextloop"
sources = ["contextloop"]
maturity = "running"

[[module]]
id = "gatehouse"
plugin = "gatehouse"
sources = ["elicitation"]
maturity = "running"
app_config = "~/ChrisBuilds64/develop/apps/gatehouse/gatehouse.toml"

# --- Roles ---------------------------------------------------------------------------
[[role]]
id = "operator"
modules = ["*"]
max_sensitivity = "confidential"
actions = ["*"]

[[role]]
id = "guest"
modules = ["worklist", "decisions", "pipeline", "contextloop"]
max_sensitivity = "internal"
actions = ["decisions.record"]
