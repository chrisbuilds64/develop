{# The built-in glyph set: one line-drawn symbol per plugin kind, coloured by the plugin's accent. #}
{% macro glyph(name, size=22) -%}
<svg class="glyph" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'film' -%}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>
{%- elif name == 'check' -%}<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m8 12 3 3 5-6"/>
{%- elif name == 'book' -%}<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h13"/><path d="M9 7h6"/>
{%- elif name == 'shield' -%}<path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6z"/><path d="m9 12 2 2 4-4"/>
{%- elif name == 'loop' -%}<path d="M17 4h2a3 3 0 0 1 3 3v3M7 20H5a3 3 0 0 1-3-3v-3"/><path d="M20 10a8 8 0 0 0-14-5M4 14a8 8 0 0 0 14 5"/><path d="m16 5 1-1 1 1M8 19l-1 1-1-1"/>
{%- elif name == 'gate' -%}<path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-7h6v7"/><path d="M4 12h16"/>
{%- elif name == 'gavel' -%}<path d="m14 4 6 6M4 20l7-7"/><rect x="11" y="3" width="6" height="6" rx="1" transform="rotate(45 14 6)"/><path d="M3 21h8"/>
{%- else -%}<path d="M12 3 4 7v10l8 4 8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/>
{%- endif -%}
</svg>
{%- endmacro %}
