# The checks every pull request runs before it may be merged into main (CONTRIBUTING.md).
# "tests" and "guards" are required; "flows" plays the sample flows and walks headless — one machine per flow, in
# parallel — and is required once it has proven stable on the runner. A pull request that touches only documentation
# (docs/, *.md) plays no flows: nothing a flow presses can have changed.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/*/pyproject.toml
      # One environment per application, as on every machine and server: their test pins differ (httpx).
      - name: casefile
        run: |
          python -m venv /tmp/cf && /tmp/cf/bin/pip install -q --upgrade pip
          /tmp/cf/bin/pip install -q -e "apps/casefile[dev]"
          cd apps/casefile && /tmp/cf/bin/python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/casefile/web/package-lock.json
      - name: The surface, for the cockpit's tests of the mounted page (web/dist is never in git)
        working-directory: apps/casefile/web
        run: npm ci --silent && npm run build --silent
      - name: cockpit
        run: |
          python -m venv /tmp/ck && /tmp/ck/bin/pip install -q --upgrade pip
          /tmp/ck/bin/pip install -q -e apps/casefile -e "apps/cockpit[dev]"
          cd apps/cockpit && /tmp/ck/bin/python -m pytest -q
      - name: pressroom-env
        run: |
          python -m venv /tmp/pe && /tmp/pe/bin/pip install -q pytest
          cd infra/pressroom && /tmp/pe/bin/python -m pytest -q tests

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Design guard (the raw-value ratchet only goes down)
        run: python tools/design_guard.py
      - name: Architecture guard (the core imports no adapter, API layer or web framework)
        run: python tools/arch_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/casefile/web/package-lock.json
      - name: The surface builds
        working-directory: apps/casefile/web
        run: |
          npm ci --silent
          npm run build --silent

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Does this change touch more than documentation?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if echo "$files" | grep -qvE '^docs/|\.md$'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  flow-plan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ids
        name: The checks this change needs (its applications' flows and walks; all when the core changed)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ids=$(python3 sandbox/sandbox.py ids "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          else
            ids=$(python3 sandbox/sandbox.py ids)
          fi
          echo "$ids"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  flow:
    needs: flow-plan
    if: needs.flow-plan.outputs.ids != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.flow-plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/*/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/casefile/web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/casefile/web/package-lock.json') }}
      - name: Sandbox
        run: |
          python3 sandbox/sandbox.py setup
          # The runner image already carries what Chromium needs. install-deps only tops it up from the Ubuntu
          # mirrors, and when those cannot be reached it hung every flow for ten minutes (2026-11-11). Try it
          # briefly; if it fails, warn and go on: a library that is really missing fails the walk itself, visibly.
          (cd apps/casefile/web && timeout 180 npx playwright install-deps chromium) \
            || echo "::warning::Could not top up Chromium's system packages (package mirrors unreachable); using the runner image as it is.
      - name: ${{ matrix.id }}
        run: python3 sandbox/sandbox.py check ${{ matrix.id }}
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-${{ matrix.id }}
          path: sandbox/.state/check/
          retention-days: 7

  flows:
    needs: [changes, flow-plan, flow]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every flow green, or none to play
        run: |
          echo "code changed: ${{ needs.changes.outputs.code }} · planned: ${{ needs.flow-plan.outputs.ids }} · flows: ${{ needs.flow.result }}"
          if [ "${{ needs.changes.outputs.code }}" != "true" ]; then exit 0; fi
          [ "${{ needs.flow-plan.result }}" = "success" ] || exit 1
          if [ "${{ needs.flow-plan.outputs.ids }}" = "[]" ]; then exit 0; fi
          [ "${{ needs.flow.result }}" = "success" ]
